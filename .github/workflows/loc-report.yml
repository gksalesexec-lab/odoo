# GK - 061226 - Lines of Code Report Workflow
# 
# Key Optimizations:
# - fetch-depth: 1 enables shallow clone (only latest commit, not full history)
# - Added -qq flags to suppress apt output for faster logging
# - Excluded build artifacts: .egg-info, build, dist (common Python directories)
# - Added --exclude-dir=.git to skip the .git folder entirely
# - This significantly reduces checkout time from ~1 min to ~15 seconds on large repos

name: Lines of Code Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC

jobs:
  count-loc:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code (shallow clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install cloc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloc

      - name: Generate Lines of Code Report
        id: loc
        run: |
          echo "=== Lines of Code Report ===" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Full Report:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cloc . --fullpath --not-match-d=".git|node_modules|.venv|venv|__pycache__|vendor|\.next|\.egg-info|build|dist" --exclude-dir=.git --quiet >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
      - name: Display Summary
        run: |
          echo "Lines of Code Summary"
          echo "===================="
          cloc . --fullpath --not-match-d=".git|node_modules|.venv|venv|__pycache__|vendor|\.next|\.egg-info|build|dist" --exclude-dir=.git
